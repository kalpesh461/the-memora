<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin Panel — The Memora</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#12180E">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body class="admin">

<!-- ============ LOGIN ============ -->
<div id="adLogin" class="ad-login">
  <form class="box" id="loginForm" novalidate>
    <img src="assets/img/logo.png" alt="The Memora" style="width:78px;height:78px;border-radius:50%;margin:0 auto 18px;object-fit:cover">
    <h1 style="font-size:1.6rem;margin-bottom:6px">Admin panel</h1>
    <p style="margin-bottom:22px;font-size:.9rem">Sign in to manage products, prices, offers and orders.</p>
    <input class="ad-in" id="loginEmail" type="email" placeholder="Email" autocomplete="username" style="text-align:center;margin-bottom:10px">
    <input class="ad-in" id="loginPw" type="password" placeholder="Password" autocomplete="current-password" style="text-align:center">
    <p id="loginErr" style="color:#E9A79E;font-size:.8rem;min-height:18px;margin:8px 0"></p>
    <button class="ad-btn" style="width:100%" type="submit">Sign in</button>
    <p class="ad-hint" style="margin-top:18px">Sign in with the admin user created in your Supabase project (Authentication → Users).</p>
    <a href="index.html" class="ad-hint" style="display:inline-block;margin-top:14px;text-decoration:underline">← Back to the website</a>
  </form>
</div>

<!-- ============ APP ============ -->
<div id="adApp" class="ad-shell hide">
  <aside class="ad-side">
    <div class="brand">
      <b>THE MEMORA</b>
      <small>Control panel</small>
    </div>
    <button class="ad-nav on" data-view="dashboard">Dashboard</button>
    <button class="ad-nav" data-view="products">Products <span class="n" id="navProducts">0</span></button>
    <button class="ad-nav" data-view="categories">Categories</button>
    <button class="ad-nav" data-view="offers">Offers &amp; coupons</button>
    <button class="ad-nav" data-view="banners">Homepage banners</button>
    <button class="ad-nav" data-view="orders">Orders <span class="n" id="navOrders">0</span></button>
    <button class="ad-nav" data-view="blog">Journal <span class="n" id="navPosts">0</span></button>
    <button class="ad-nav" data-view="reviews">Testimonials</button>
    <button class="ad-nav" data-view="faqs">FAQs</button>
    <button class="ad-nav" data-view="settings">Settings</button>
    <button class="ad-nav" data-view="backup">Backup &amp; publish</button>
    <div style="margin-top:auto;padding-top:18px;border-top:1px solid var(--ad-line);display:grid;gap:6px">
      <a class="ad-nav" href="index.html" target="_blank" rel="noopener">View website ↗</a>
      <button class="ad-nav" id="logoutBtn">Sign out</button>
    </div>
  </aside>

  <main class="ad-main">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">
      <button class="ad-btn ghost sm ad-burger" id="adBurger">Menu</button>
      <span style="font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ad-mut)">The Memora · Control panel</span>
    </div>
    <div id="adBody"></div>
  </main>
</div>

<!-- ============ MODAL ============ -->
<div class="ad-modal" id="adModal">
  <div class="ad-dialog" id="modalBody"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/store.js"></script>
<script>
/* minimal toast for the admin panel */
(function () {
  var wrap;
  window.toast = function (msg, type) {
    if (!wrap) { wrap = document.createElement('div'); wrap.className = 'toast-wrap'; document.body.appendChild(wrap); }
    var t = document.createElement('div');
    t.className = 'toast';
    t.innerHTML = '<span style="color:var(--gold)">' + (type === 'err' ? '!' : '✓') + '</span><span>' + msg + '</span>';
    wrap.appendChild(t);
    setTimeout(function () { t.classList.add('out'); setTimeout(function () { t.remove(); }, 380); }, 2600);
  };
})();
</script>
<script src="assets/js/admin.js"></script>
</body>
</html>
